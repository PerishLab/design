name: deploy

on:
  workflow_dispatch:

concurrency:
  group: design-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    container: git.perish.top/perishfire/images/forge@sha256:e952adc3442568f415668a72d84e5efa80c56ecc4df7847d41e87b97c15f588d
    env:
      PLUMB_SITE_TOKEN: ${{ secrets.DESIGN_SITE_TOKEN }}
      PLUMB_SITE_ACCOUNT: ${{ vars.DESIGN_SITE_ACCOUNT }}
      PLUMB_SITE_DOMAIN: ${{ vars.DESIGN_SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Install JS dependencies
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          corepack enable
          pnpm install --frozen-lockfile

      - name: Deploy
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          plumb site deploy .
