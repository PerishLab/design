name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Install dependencies
        run: |
          set -eu
          corepack enable
          pnpm install --frozen-lockfile

      - name: Guard
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          deno run --allow-read "--allow-write=." --allow-env --allow-net "--allow-run=git,tea,deno,ectropy,plumb,runseal,sh,pnpm,node,npm,rustc" --config .runseal/deno.json --lock .runseal/deno.lock --frozen=true .runseal/wrappers/guard.ts --fresh

      - name: Report failure
        if: failure()
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deno eval '
            const temp = Deno.env.get("RUNNER_TEMP");
            const log = await Deno.readTextFile(`${temp}/lane.log`).catch(() => "(no lane.log captured)");
            const tail = log.split("\n").slice(-120).join("\n");
            const api = Deno.env.get("GITHUB_API_URL");
            const repo = Deno.env.get("GITHUB_REPOSITORY");
            const run = Deno.env.get("GITHUB_RUN_NUMBER");
            const res = await fetch(`${api}/repos/${repo}/issues`, {
              method: "POST",
              headers: {
                Authorization: `token ${Deno.env.get("PROBE_TOKEN")}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                title: `guard run ${run} failed`,
                body: "```\n" + tail + "\n```",
              }),
            });
            console.log(`failure report: HTTP ${res.status}`);
            await res.body?.cancel();
          '
