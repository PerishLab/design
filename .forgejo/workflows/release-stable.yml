name: release-stable

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional stable version override, for example v0.1.0"
        required: false
        default: ""
        type: string
      publish:
        description: "true publishes to jsr; false rehearses the lane and stops after the dry run"
        required: false
        default: "true"
        type: string
      package:
        description: "Optional package slug to release or repair"
        required: false
        default: ""
        type: string

env:
  RELEASE_CHANNEL: stable

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Install dependencies
        run: |
          set -eu
          corepack enable
          pnpm install --frozen-lockfile

      - name: Guard
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          pnpm biome ci .
          pnpm -r build
          pnpm -r exec tsc --noEmit
          pnpm -r test
          deno check \
            .forgejo/scripts/release/metadata/stable.ts \
            .forgejo/scripts/release/jsr/probes/vite-plugin-design.ts
          sh -n .forgejo/scripts/release/jsr/verify.sh
          sh -n .forgejo/scripts/release/jsr/smoke.sh
          node --check .forgejo/scripts/release/jsr/probes/react-components.mjs
          plumb doctor .
          ectropy .

  release:
    needs: guard
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - seat: packages/vite-plugin-design
            slug: vite-plugin-design
          - seat: packages/react-components
            slug: react-components
    env:
      DENO_NO_PACKAGE_JSON: "1"
      STABLE_VERSION_OVERRIDE: ${{ inputs.version_override }}
      JSR_PUBLISH_TOKEN: ${{ secrets.JSR_PUBLISH_TOKEN }}
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      PUBLISH: ${{ inputs.publish }}
      SEAT: ${{ matrix.seat }}
      SLUG: ${{ matrix.slug }}
    steps:
      - name: Checkout
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        uses: actions/checkout@v6

      - name: Resolve stable metadata
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        id: stable
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          deno run --allow-env --allow-read --allow-net --allow-write="$GITHUB_OUTPUT" .forgejo/scripts/release/metadata/stable.ts "$SEAT"

      - name: Stamp stable version
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        env:
          REGISTRY: ${{ steps.stable.outputs.registry }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$REGISTRY" = "jsr" ]; then manifest="$SEAT/deno.json"; else manifest="$SEAT/package.json"; fi
          deno eval "const path = Deno.args[0]; const doc = JSON.parse(Deno.readTextFileSync(path)); doc.version = Deno.args[1]; Deno.writeTextFileSync(path, JSON.stringify(doc, null, 2) + '\n');" -- "$manifest" "${RELEASE_VERSION#v}"
          grep '"version"' "$manifest"

      - name: Build the package
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        env:
          REGISTRY: ${{ steps.stable.outputs.registry }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$REGISTRY" != "npm" ]; then
            echo "jsr publishes source: no build"
            exit 0
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter "$(node -p "require('./$SEAT/package.json').name")" build

      - name: Publish dry run
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        env:
          REGISTRY: ${{ steps.stable.outputs.registry }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          cd "$SEAT"
          if [ "$REGISTRY" = "jsr" ]; then
            deno publish --dry-run --allow-dirty
          else
            pnpm publish --dry-run --no-git-checks --registry https://registry.npmjs.org
          fi

      - name: Publish
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        env:
          ALREADY_PUBLISHED: ${{ steps.stable.outputs.already_published }}
          REGISTRY: ${{ steps.stable.outputs.registry }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping publish"
            exit 0
          fi
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "jsr already holds $RELEASE_VERSION for $SLUG: skipping publish"
            exit 0
          fi
          cd "$SEAT"
          if [ "$REGISTRY" = "jsr" ]; then
            case "$JSR_PUBLISH_TOKEN" in
              "" | REPLACE_ME*)
                echo "JSR_PUBLISH_TOKEN is not filled; fill the repository secret before publishing" >&2
                exit 1
                ;;
            esac
            JSR_URL="https://jsr.io" deno publish --token "$JSR_PUBLISH_TOKEN" --allow-dirty
          else
            case "$NPM_PUBLISH_TOKEN" in
              "" | REPLACE_ME*)
                echo "NPM_PUBLISH_TOKEN is not filled; fill the repository secret before publishing" >&2
                exit 1
                ;;
            esac
            {
              echo "registry=https://registry.npmjs.org/"
              printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_PUBLISH_TOKEN"
            } > "$RUNNER_TEMP/npmrc"
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" pnpm publish --no-git-checks --registry https://registry.npmjs.org
          fi

      - name: Verify jsr publish
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        env:
          PACKAGE_NAME: ${{ steps.stable.outputs.package_name }}
          REGISTRY: ${{ steps.stable.outputs.registry }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping verify"
            exit 0
          fi
          sh .forgejo/scripts/release/jsr/verify.sh "$REGISTRY" "$PACKAGE_NAME" "${RELEASE_VERSION#v}"

      - name: Smoke import
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        env:
          PACKAGE_NAME: ${{ steps.stable.outputs.package_name }}
          REGISTRY: ${{ steps.stable.outputs.registry }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping smoke"
            exit 0
          fi
          sh .forgejo/scripts/release/jsr/smoke.sh "$REGISTRY" "$PACKAGE_NAME" "${RELEASE_VERSION#v}" "$SLUG"

      - name: Tag release
        if: ${{ inputs.package == '' || inputs.package == matrix.slug }}
        env:
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping tag"
            exit 0
          fi
          tag="$SLUG/$RELEASE_VERSION"
          held=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -n "$held" ]; then
            if [ "$held" = "$(git rev-parse HEAD)" ]; then
              echo "tag $tag already on origin at this commit: skipping tag"
              exit 0
            fi
            echo "tag $tag already on origin at $held, but HEAD is $(git rev-parse HEAD)" >&2
            echo "a different commit already owns this version; the version numbering collided" >&2
            exit 1
          fi
          git config user.name "forgejo-actions"
          git config user.email "actions@git.perish.top"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"

      - name: Publish summary
        if: ${{ always() && (inputs.package == '' || inputs.package == matrix.slug) }}
        env:
          ALREADY_PUBLISHED: ${{ steps.stable.outputs.already_published }}
          PACKAGE_NAME: ${{ steps.stable.outputs.package_name }}
          REGISTRY: ${{ steps.stable.outputs.registry }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
          STATE_SOURCE: ${{ steps.stable.outputs.state_source }}
        run: |
          set -eu
          {
            echo "## release-stable: $PACKAGE_NAME"
            echo ""
            echo "- release version: $RELEASE_VERSION"
            echo "- state source: $STATE_SOURCE"
            if [ "$PUBLISH" != "true" ]; then
              echo "- mode: REHEARSAL (nothing published, nothing tagged)"
            elif [ "$ALREADY_PUBLISHED" = "true" ]; then
              echo "- mode: repair pass (publish skipped, tag ensured)"
            else
              echo "- mode: published"
            fi
            echo "- registry: $REGISTRY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lane log
        if: ${{ always() && (inputs.package == '' || inputs.package == matrix.slug) }}
        uses: actions/upload-artifact@v3
        with:
          name: lane-log-${{ matrix.slug }}
          path: ${{ runner.temp }}/lane.log

      - name: Report failure
        if: ${{ failure() && (inputs.package == '' || inputs.package == matrix.slug) }}
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deno eval '
            const temp = Deno.env.get("RUNNER_TEMP");
            const log = await Deno.readTextFile(`${temp}/lane.log`).catch(() => "(no lane.log captured)");
            const tok = Deno.env.get("JSR_PUBLISH_TOKEN") ?? "";
            const safe = tok === "" ? log : log.split(tok).join("<token>");
            const tail = safe.split("\n").slice(-100).join("\n");
            const api = Deno.env.get("GITHUB_API_URL");
            const repo = Deno.env.get("GITHUB_REPOSITORY");
            const flow = Deno.env.get("GITHUB_WORKFLOW");
            const run = Deno.env.get("GITHUB_RUN_NUMBER");
            const slug = Deno.env.get("SLUG");
            const res = await fetch(`${api}/repos/${repo}/issues`, {
              method: "POST",
              headers: {
                Authorization: `token ${Deno.env.get("PROBE_TOKEN")}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                title: `${flow} run ${run}: ${slug} failed`,
                body: "```\n" + tail + "\n```",
              }),
            });
            console.log(`failure report: HTTP ${res.status}`);
            await res.body?.cancel();
          '
