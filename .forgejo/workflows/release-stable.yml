name: release-stable

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional stable version override, for example v0.1.0"
        required: false
        default: ""
        type: string
      publish:
        description: "true publishes to jsr; false rehearses the lane and stops after the dry run"
        required: false
        default: "true"
        type: string

env:
  RELEASE_CHANNEL: stable

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned negentropy
        run: |
          set -eu
          curl -fsSL https://releases.negentropy.perish.uk/manage.sh | sh -s -- install --channel stable --version $(cat .runseal/negentropy.version) --bin-dir $HOME/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Guard
        run: |
          set -eu
          negentropy --strict .

  release:
    needs: guard
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - seat: packages/vite-plugin-design
            slug: vite-plugin-design
          - seat: packages/react-components
            slug: react-components
    env:
      DENO_NO_PACKAGE_JSON: "1"
      STABLE_VERSION_OVERRIDE: ${{ inputs.version_override }}
      JSR_PUBLISH_TOKEN: ${{ secrets.JSR_PUBLISH_TOKEN }}
      PUBLISH: ${{ inputs.publish }}
      SEAT: ${{ matrix.seat }}
      SLUG: ${{ matrix.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve stable metadata
        id: stable
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          deno run --allow-env --allow-read --allow-net --allow-write="$GITHUB_OUTPUT" .forgejo/scripts/release/metadata/stable.ts "$SEAT"

      - name: Stamp stable version
        env:
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          deno eval "const path = Deno.args[0] + '/deno.json'; const doc = JSON.parse(Deno.readTextFileSync(path)); doc.version = Deno.args[1]; Deno.writeTextFileSync(path, JSON.stringify(doc, null, 2) + '\n');" -- "$SEAT" "${RELEASE_VERSION#v}"
          grep '"version"' "$SEAT/deno.json"

      - name: Publish dry run
        env:
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          cd "$SEAT"
          deno publish --dry-run --allow-dirty

      - name: Publish
        env:
          ALREADY_PUBLISHED: ${{ steps.stable.outputs.already_published }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping publish"
            exit 0
          fi
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "jsr already holds $RELEASE_VERSION for $SLUG: skipping publish"
            exit 0
          fi
          case "$JSR_PUBLISH_TOKEN" in
            "" | REPLACE_ME*)
              echo "JSR_PUBLISH_TOKEN is not filled; fill the repository secret before publishing" >&2
              exit 1
              ;;
          esac
          cd "$SEAT"
          JSR_URL="https://jsr.io" deno publish --token "$JSR_PUBLISH_TOKEN" --allow-dirty

      - name: Verify jsr publish
        env:
          PACKAGE_NAME: ${{ steps.stable.outputs.package_name }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping verify"
            exit 0
          fi
          sh .forgejo/scripts/release/jsr/verify.sh "$PACKAGE_NAME" "${RELEASE_VERSION#v}"

      - name: Smoke import
        env:
          PACKAGE_NAME: ${{ steps.stable.outputs.package_name }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping smoke"
            exit 0
          fi
          sh .forgejo/scripts/release/jsr/smoke.sh "$PACKAGE_NAME" "${RELEASE_VERSION#v}" "$SLUG"

      - name: Tag release
        env:
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          if [ "$PUBLISH" != "true" ]; then
            echo "rehearsal: skipping tag"
            exit 0
          fi
          tag="$SLUG/$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already on origin: skipping tag"
            exit 0
          fi
          git config user.name "forgejo-actions"
          git config user.email "actions@git.perish.top"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"

      - name: Publish summary
        if: always()
        env:
          ALREADY_PUBLISHED: ${{ steps.stable.outputs.already_published }}
          PACKAGE_NAME: ${{ steps.stable.outputs.package_name }}
          RELEASE_VERSION: ${{ steps.stable.outputs.release_version }}
          STATE_SOURCE: ${{ steps.stable.outputs.state_source }}
        run: |
          set -eu
          {
            echo "## release-stable: $PACKAGE_NAME"
            echo ""
            echo "- release version: $RELEASE_VERSION"
            echo "- state source: $STATE_SOURCE"
            if [ "$PUBLISH" != "true" ]; then
              echo "- mode: REHEARSAL (nothing published, nothing tagged)"
            elif [ "$ALREADY_PUBLISHED" = "true" ]; then
              echo "- mode: repair pass (publish skipped, tag ensured)"
            else
              echo "- mode: published"
            fi
            echo "- jsr: https://jsr.io/$PACKAGE_NAME/versions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lane log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lane-log-${{ matrix.slug }}
          path: ${{ runner.temp }}/lane.log

      - name: Report failure
        if: failure()
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deno eval '
            const temp = Deno.env.get("RUNNER_TEMP");
            const log = await Deno.readTextFile(`${temp}/lane.log`).catch(() => "(no lane.log captured)");
            const tok = Deno.env.get("JSR_PUBLISH_TOKEN") ?? "";
            const safe = tok === "" ? log : log.split(tok).join("<token>");
            const tail = safe.split("\n").slice(-100).join("\n");
            const api = Deno.env.get("GITHUB_API_URL");
            const repo = Deno.env.get("GITHUB_REPOSITORY");
            const flow = Deno.env.get("GITHUB_WORKFLOW");
            const run = Deno.env.get("GITHUB_RUN_NUMBER");
            const slug = Deno.env.get("SLUG");
            const res = await fetch(`${api}/repos/${repo}/issues`, {
              method: "POST",
              headers: {
                Authorization: `token ${Deno.env.get("PROBE_TOKEN")}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                title: `${flow} run ${run}: ${slug} failed`,
                body: "```\n" + tail + "\n```",
              }),
            });
            console.log(`failure report: HTTP ${res.status}`);
            await res.body?.cancel();
          '
