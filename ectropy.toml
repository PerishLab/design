[[boundary]]
allow = ["path"]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
paths = [
    "packages/react-components/vitest.config.ts",
    "packages/vite-plugin-design/vitest.config.ts",
    "apps/react-docs/vite.config.ts",
    "apps/react-docs/vitest.config.ts",
]

[comment]
allow = false

[[grant]]
paths = [
    "packages/react-components/**",
    "apps/react-docs/**",
]
syntax = "style"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "apps/*/tests/**/*.test.tsx",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "apps/*/tests/**/*.test.tsx",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
    "packages/vite-plugin-design/src/config.ts",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
    "apps/*/src",
    "apps/*/tests",
    "packages/*/lib",
    "packages/*/src",
    "packages/*/tests",
]

[scan]
exclude = [
    "**/dist/**",
    "**/node_modules/**",
]
include = [
    "apps/**/*.css",
    "apps/**/*.scss",
    "apps/**/*.ts",
    "apps/**/*.tsx",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.tsx",
]

[vocabulary]

[word]
single = true
