[[boundary]]
allow = ["path"]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
paths = [
    "packages/design/vitest.config.ts",
    "apps/docs/vite.config.ts",
    "apps/docs/vitest.config.ts",
]

[comment]
allow = false

[[grant]]
paths = [
    "packages/bone/**",
    "packages/design/**",
    "packages/token/**",
]
syntax = "style"

[[grant]]
paths = ["apps/docs/vite.config.ts"]
syntax = "embed"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.ts",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.ts",
    "packages/design/src/vite/config.ts",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "apps/*",
    "apps/*/src",
    "apps/*/tests",
    "packages/*/lib",
    "packages/*/src",
    "packages/*/tests",
]

[scan]
exclude = [
    "**/dist/**",
    "**/node_modules/**",
    "**/.svelte-kit/**",
]
include = [
    "apps/**/*.css",
    "apps/**/*.scss",
    "apps/**/*.ts",
    "apps/**/*.svelte",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.svelte",
]

[vocabulary]
[[vocabulary.term]]
description = "Rollup's plugin-context method that registers a file the build watches; the name is fixed by Rollup."
name = "addWatchFile"

[[vocabulary.term]]
description = "Rollup's build hook that runs when a build starts; the name is fixed by Rollup."
name = "buildStart"

[[vocabulary.term]]
description = "Vite's plugin hook that receives the resolved configuration; the name is fixed by Vite."
name = "configResolved"

[[vocabulary.term]]
description = "Vite's plugin hook that configures the preview server; the name is fixed by Vite."
name = "configurePreviewServer"

[[vocabulary.term]]
description = "Vite's plugin hook that configures the development server; the name is fixed by Vite."
name = "configureServer"

[[vocabulary.term]]
description = "Rollup's plugin-context method that emits an asset into the bundle; the name is fixed by Rollup."
name = "emitFile"

[[vocabulary.term]]
description = "Rollup's output hook that runs before a bundle is written; the name is fixed by Rollup."
name = "generateBundle"

[[vocabulary.term]]
description = "Vite's plugin hook that handles a hot module update; the name is fixed by Vite."
name = "handleHotUpdate"

[[vocabulary.term]]
description = "Rollup's build hook that resolves a module id; the name is fixed by Rollup."
name = "resolveId"

[word]
single = true
