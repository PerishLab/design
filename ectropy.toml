[[boundary]]
allow = ["path"]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
paths = [
    "packages/design/vitest.config.ts",
    "apps/docs/vite.config.ts",
    "apps/docs/vitest.config.ts",
]

[comment]
allow = false

[[grant]]
paths = [
    "packages/design/**",
    "packages/token/**",
]
syntax = "style"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.ts",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.ts",
    "packages/design/src/vite/config.ts",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
    "apps/*/src",
    "apps/*/tests",
    "packages/*/lib",
    "packages/*/src",
    "packages/*/tests",
]

[scan]
exclude = [
    "**/dist/**",
    "**/node_modules/**",
    "**/.svelte-kit/**",
]
include = [
    "apps/**/*.css",
    "apps/**/*.scss",
    "apps/**/*.ts",
    "apps/**/*.svelte",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.svelte",
]

[vocabulary]

[word]
single = true
