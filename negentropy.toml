[scan]
include = [
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "apps/**/*.scss",
  "packages/**/*.ts",
  "packages/**/*.tsx",
  "packages/**/*.scss",
  "docs/**/*.md",
]
exclude = [
  "**/node_modules/**",
  "**/dist/**",
]

[module]
roots = [
  "apps/*/src",
  "apps/*/tests",
  "packages/*/src",
  "packages/*/tests",
]

[limit]
block = 4
path = 4

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = [
  "apps/*/tests/**/*.test.ts",
  "apps/*/tests/**/*.test.tsx",
  "packages/*/tests/**/*.test.ts",
  "packages/*/tests/**/*.test.tsx",
]

[[boundary]]
paths = [
  "packages/react-components/vitest.config.ts",
  "packages/vite-plugin-design/vitest.config.ts",
  "apps/react-docs/vite.config.ts",
  "apps/react-docs/vitest.config.ts",
]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
allow = ["path"]

[[grant]]
syntax = "style"
paths = [
  "packages/react-components/**",
  "apps/react-docs/**",
]

[[grant]]
syntax = "environment"
paths = [
  "packages/vite-plugin-design/src/config.ts",
]
